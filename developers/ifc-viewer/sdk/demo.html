<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFC Viewer SDK – Live Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; display: flex; flex-direction: column; }
    #ifc-viewer { width: 100%; height: 100%; min-height: 0; flex: 1; }
  </style>
</head>
<body>

  <div id="ifc-viewer"><bim-grid style="width:100%;height:100%;"></bim-grid></div>

  <script type="module">
    import { Viewer, bcf } from "https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js";

    const viewer = new Viewer("#ifc-viewer");
    await viewer.ready;

    const model = await loadModel(
      "NBU_MedicalClinic_Arch-Optimized.ifc",
      "https://raw.githubusercontent.com/flinker-app/ifc-sample-files/main/NBU_MedicalClinic/NBU_MedicalClinic_Arch-Optimized.ifc"
    );

    const walls    = componentsByType(model, ["IFCWALL", "IFCWALLSTANDARDCASE"], 220);
    const slabs    = componentsByType(model, ["IFCSLAB"], 120);
    const openings = componentsByType(model, ["IFCDOOR", "IFCWINDOW"], 120);
    const spaces   = componentsByType(model, ["IFCSPACE"], 80);

    const { bytes, topicGuid } = await createBCF("Walls, slabs, openings, and spaces by color", {
      coloring: [
        { color: "80E11D48", components: walls },
        { color: "668B5CF6", components: slabs },
        { color: "BFF59E0B", components: openings },
        { color: "4D22C55E", components: spaces }
      ]
    });

    await viewer.add("walls-slabs-openings-and-spaces-by-color.bcf", bytes);
    await viewer.selectTopic(topicGuid);

    async function loadModel(name, url) {
      const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());
      await viewer.add(name, bytes.slice());
      return { name, bytes };
    }

    function componentsByType(file, types, limit = Number.POSITIVE_INFINITY) {
      file.text ??= new TextDecoder().decode(file.bytes);
      const components = [];
      for (const type of types) {
        const regex = new RegExp(`#\\d+\\s*=\\s*${type}\\('([^']+)'`, "g");
        for (const match of file.text.matchAll(regex)) {
          components.push({ ifc_guid: match[1], authoring_tool_id: null });
          if (components.length >= limit) return components;
        }
      }
      return components;
    }

    async function createBCF(title, state) {
      const element = (name, attributes = {}, content = []) => ({ name, namespaceURI: "", attributes, content });
      const text = (name, value) => element(name, {}, [String(value)]);
      const topicGuid = crypto.randomUUID();
      const topic = element("Topic", { Guid: topicGuid, TopicType: "Coordination", TopicStatus: "Open" }, [
        text("Title", title),
        text("CreationDate", new Date().toISOString()),
        text("CreationAuthor", "docs@example.com")
      ]);
      const archive = await viewer.createTopic(topic, { snapshot: false });
      const viewpoint = Object.values(archive.entries).find(entry => entry.document?.schema === "bcf-3.0/visinfo").document;
      const components = element("Components", {}, [
        element("Visibility", { DefaultVisibility: "true" }, [
          element("ViewSetupHints", { SpacesVisible: "false", SpaceBoundariesVisible: "false", OpeningsVisible: "false" })
        ]),
        element("Coloring", {}, state.coloring.filter(group => group.components.length).map(group =>
          element("Color", { Color: group.color }, [
            element("Components", {}, group.components.map(component => element("Component", { IfcGuid: component.ifc_guid })))
          ])
        ))
      ]);
      viewpoint.root.content = [components, ...viewpoint.root.content.filter(node => node.name !== "Components")];
      return { topicGuid, bytes: await bcf.save(archive) };
    }
  </script>

</body>
</html>
